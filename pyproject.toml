[build-system]
requires = ["uv_build==0.7.19"]
build-backend = "uv_build"

[project]
name = "retejo"
description = "Modern python http client"
version = "1.0.0"
readme = "README.md"
authors = [
    { name = "Ivan Kirpichnikov", email = "mmssvvvv570@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "adaptix==3.0.0b11",
    "typing_extensions~=4.10.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Networking",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
]

[project.optional-dependencies]
requests = [ "requests~=2.27.0" ]
aiohttp = [ "aiohttp~=3.10.0" ]

[dependency-groups]
integrations = [ "retejo[aiohttp, requests]" ]

types = [ "types-requests" ]

lint = [
    { include-group = "types" },
    "mypy~=1.16.1",
    "ruff~=0.11.13",
    "codespell~=2.4.1",
    "bandit~=1.8.5",
    "slotscheck==0.19.1",
]

tests = [
    "pytest~=8.4.1",
    "pytest-asyncio~=1.0.0",
    "pytest-xdist~=3.7.0",
    "pytest-cov~=6.2.1",
    "coverage~=7.9.1",
]

docs = [
    "mkdocs-material==9.6.14",
    "mkdocs-static-i18n==1.3.0",
    "mdx-include==1.4.2",
    "mkdocstrings[python]==0.29.1",
    "mkdocs-literate-nav==0.6.2",
    "mkdocs-git-revision-date-localized-plugin==1.4.7",
    "mike==2.1.3",                                      # versioning
    "mkdocs-minify-plugin==0.8.0",
    "mkdocs-macros-plugin==1.3.7",                      # includes with variables
    "mkdocs-glightbox==0.4.0",                          # img zoom
]

dev = [
    { include-group = "integrations" },
    { include-group = "lint" },
    { include-group = "tests" },
    { include-group = "docs" },
]

[tool.mypy]
files = ["src", "tests"]
exclude = [
    "src/retejo/_type_tools/*",
]
strict = true

# disallow_any_decorated = false
# disallow_any_generics = false
# disallow_any_explicit = false
# disallow_any_expr = false

[tool.ruff]
include = [
    "src/retejo/**/*.py",
    "tests/**/*.py",
    "pyproject.toml"
]
exclude = ["src/retejo/_type_tools/**"]
fix = true
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors     https://docs.astral.sh/ruff/rules/#error-e
    "W",     # pycodestyle warnings   https://docs.astral.sh/ruff/rules/#warning-w
    "C90",   # mccabe                 https://docs.astral.sh/ruff/rules/#mccabe-c90
    "N",     # pep8-naming            https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "D",     # pydocstyle             https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "I",     # isort                  https://docs.astral.sh/ruff/rules/#isort-i
    "F",     # pyflakes               https://docs.astral.sh/ruff/rules/#pyflakes-f
    "ASYNC", # flake8-async           https://docs.astral.sh/ruff/rules/#flake8-async-async
    "C4",    # flake8-comprehensions  https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "B",     # flake8-bugbear         https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "Q",     # flake8-quotes          https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "T20",   # flake8-print           https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "SIM",   # flake8-simplify        https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "PT",    # flake8-pytest-style    https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
    "PTH",   # flake8-use-pathlib     https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "TCH",   # flake8-type-checking   https://docs.astral.sh/ruff/rules/#flake8-type-checking-tch
    "RUF",   # Ruff-specific rules    https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "PERF",  # Perflint               https://docs.astral.sh/ruff/rules/#perflint-perf
    "UP",    # pyupgrade              https://docs.astral.sh/ruff/rules/#pyupgrade-up
]

ignore = [
    "RUF009", # Do not call in dataclass defaults

    "ASYNC109", # own timeout implementation

    "E501",     # line too long, handled by formatter later
    "C901",     # too complex

    # todo pep8-naming
    "N817",     # CamelCase `*` imported as acronym `*`
    "N815",     # Variable `*` in class scope should not be mixedCase
    "N803",     # Argument name `expandMessageExamples` should be lowercase

    # todo pydocstyle
    "D100",     # missing docstring in public module
    "D101",
    "D102",
    "D103",
    "D104",     # missing docstring in public package
    "D105",     # missing docstring in magic methods
    "D106",     # missing docstring in public nested class
    "D107",     # missing docstring in __init__
    "D212",
    "D203",

    "TC002",

    "UP038",
]


[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "--cov src"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
parallel = true
branch = true
concurrency = ["multiprocessing", "thread"]
source = ["tests"]
omit = ["src/retejo/_type_tools/**"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
    "def __repr__",
    "lambda: None",
    "from .*",
    "import .*",
    '@(abc\.)?abstractmethod',
    "raise NotImplementedError",
    'raise AssertionError',
    'raise RuntimeError',
    'logger\..*',
    "pass",
    '\.\.\.',
]

[tool.slotscheck]
strict-imports = true
exclude-modules = '''
(
  (^|\.)_type_tools  # ignore retejo._type_tools
)
'''

[tool.bandit]
exclude_dirs = ["src/retejo/_type_tools"]
